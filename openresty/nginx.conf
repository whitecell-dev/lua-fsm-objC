error_log logs/error.log info;

events {
    worker_connections 1024;
}

http {
    # FIX (was KNOWN, recon 7/B24). This hardcoded
    # /usr/local/openresty/site/lualib and omitted the repo root, so
    # require("effect_contract") and require("init") could not resolve and
    # /contract, /fsm/ and /mock/* all failed.
    #
    # The path now points INTO THE REPO rather than at an installed copy of it.
    # That is deliberate: /usr/local/openresty/site/lualib on the machine this
    # was fixed on held a stale duplicate of these files that had silently
    # drifted from the repo. A read-only mount at /app removes that whole bug
    # class -- there is no second copy to fall out of sync.
    #
    #   /app/?.lua                       -> init, effect_contract, hardened,
    #                                       calyx_bundle, session_fsm
    #   /app/openresty/lualib/?.lua       -> nginx_host, mock_data, stream_mock
    #   /app/openresty/lualib/calyx/?.lua -> calyx/session_fsm
    #
    # The /usr/local/openresty/site/lualib entries were REMOVED rather than kept
    # as a fallback: a stale copy that only loads when the repo is absent is
    # exactly the silent-drift failure this file already had.
    #
    # NOTE: nginx cannot substitute environment variables here. `env FOO;`
    # declares a variable for the WORKER environment (os.getenv); it does not
    # create an nginx $variable usable in lua_package_path. These are literal.
    # NOTE: /usr/local/openresty/lualib is OpenResty's OWN lualib -- that is
    # where resty.core, resty.lock, resty.redis, lua-resty-* etc. live. It is
    # NOT where this project's files go. It has to be listed explicitly:
    # replacing the image's stock nginx.conf removes the lua_package_path the
    # image would otherwise have set, and without this entry the container
    # fails to start with "no file 'resty/core'" at the /mock/stream block.
    # Verified by running the stack, not by reading the config.
    lua_package_path "/app/?.lua;/app/openresty/lualib/?.lua;/app/openresty/lualib/calyx/?.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";

    # FIX: lua_package_cpath was never set at all. cjson and lsqlite3 are C
    # modules and cannot load without it even when the .lua files resolve.
    lua_package_cpath "/usr/local/lib/lua/5.1/?.so;/usr/local/lib/lua/5.1/?/?.so;?";

    # Per-worker start time, consumed by /stats and /debug below.
    init_worker_by_lua_block {
        worker_start_time = ngx.time()
    }

    lua_shared_dict fsm_state 10m;
    lua_shared_dict fsm_data 10m;
    lua_shared_dict audit_log 10m;
    lua_shared_dict contract_cache 10m;

    default_type application/json;

    server {
        listen 8080;
        server_name localhost;

        location /health {
            content_by_lua_block {
                ngx.say('{"status": "ok", "contract": "v1.0.0"}')
            }
        }

        location /fsm/ {
            lua_need_request_body on;
            # FIX: this also pointed at an INSTALLED copy. In the container that
            # path holds none of our files, so /fsm/ returned HTTP 404 even after
            # lua_package_path was fixed. On bare metal it silently served a
            # stale copy, which is how the problem stayed hidden. Points into the
            # read-only repo mount now.
            content_by_lua_file /app/openresty/lualib/nginx_host.lua;
        }

        location /contract {
            content_by_lua_block {
                local ok, result = pcall(function()
                    local EffectContract = require("effect_contract")
                    return EffectContract.get_spec()
                end)

                if not ok then
                    ngx.status = 500
                    ngx.say('{"error": "Failed to load effect_contract"}')
                    return
                end

                ngx.say(require("cjson").encode(result))
            }
        }

        location /stats {
            content_by_lua_block {
                local cjson = require("cjson")
                local stats = {
                    status = "ok",
                    -- FIX: ngx.start_time() does not exist in ngx_lua, so this
                    -- location returned HTTP 500 on every request ("attempt to
                    -- call field 'start_time' (a nil value)"). Verified on
                    -- OpenResty 1.31.1.1. Uses the per-worker start time set in
                    -- init_worker_by_lua_block above.
                    uptime = worker_start_time and (ngx.now() - worker_start_time) or nil,
                    contract_version = "1.0.0"
                }
                ngx.say(cjson.encode(stats))
            }
        }

        location /cache {
            content_by_lua_block {
                local cjson = require("cjson")
                local dict = ngx.shared.contract_cache
                -- Get all keys safely
                local keys = {}
                local all_keys = dict:get_keys(0)
                if all_keys then
                    for i = 1, #all_keys do
                        table.insert(keys, all_keys[i])
                    end
                end
                ngx.say(cjson.encode({ 
                    status = "cache_available", 
                    total_keys = #keys,
                    sample_keys = keys 
                }))
            }
        }

        location /audit {
            content_by_lua_block {
                local cjson = require("cjson")
                local dict = ngx.shared.audit_log

                local entries = {}
                for i = 1, 50 do
                    local val = dict:get("audit:" .. i)
                    if val then
                        local ok, parsed = pcall(cjson.decode, val)
                        if ok then
                            table.insert(entries, parsed)
                        else
                            table.insert(entries, val)
                        end
                    end
                end

                ngx.say(cjson.encode({ audit_entries = entries }))
            }
        }

        location /debug {
            content_by_lua_block {
                local cjson = require("cjson")
                
                -- Safely get stats from each shared dict
                local fsm_state_dict = ngx.shared.fsm_state
                local fsm_data_dict = ngx.shared.fsm_data
                local audit_dict = ngx.shared.audit_log
                local cache_dict = ngx.shared.contract_cache
                
                local debug_info = {
                    shared_dicts = {
                        fsm_state = fsm_state_dict and "exists" or "missing",
                        fsm_data = fsm_data_dict and "exists" or "missing",
                        audit_log = audit_dict and "exists" or "missing",
                        contract_cache = cache_dict and "exists" or "missing"
                    },
                    stats = {
                        fsm_state_keys = fsm_state_dict and fsm_state_dict:get_keys(0) and #fsm_state_dict:get_keys(0) or 0,
                        fsm_data_keys = fsm_data_dict and fsm_data_dict:get_keys(0) and #fsm_data_dict:get_keys(0) or 0,
                        audit_log_keys = audit_dict and audit_dict:get_keys(0) and #audit_dict:get_keys(0) or 0,
                        contract_cache_keys = cache_dict and cache_dict:get_keys(0) and #cache_dict:get_keys(0) or 0
                    },
                    -- FIX: ngx.start_time() does not exist in ngx_lua, so this
                    -- location returned HTTP 500 on every request ("attempt to
                    -- call field 'start_time' (a nil value)"). Verified on
                    -- OpenResty 1.31.1.1. Uses the per-worker start time set in
                    -- init_worker_by_lua_block above.
                    uptime = worker_start_time and (ngx.now() - worker_start_time) or nil,
                    timestamp = ngx.now(),
                    worker_pid = ngx.worker.pid()
                }
                
                ngx.say(cjson.encode(debug_info))
            }
        }
    
	# Real-time mock data generation endpoints
        location /mock/generate {
            content_by_lua_block {
                local cjson = require("cjson")
                local mock = require("mock_data")
                
                local args = ngx.req.get_uri_args()
                local user_id = tonumber(args.user_id) or 100
                local count = tonumber(args.count) or 5
                
                local result = mock.run_mock_scenario(user_id, count)
                ngx.say(cjson.encode(result))
            }
        }
        
        location /mock/metrics {
            content_by_lua_block {
                local cjson = require("cjson")
                local mock = require("mock_data")
                
                local args = ngx.req.get_uri_args()
                local count = tonumber(args.count) or 10
                
                local result = mock.generate_random_metrics(count)
                ngx.say(cjson.encode(result))
            }
        }
        
        location /mock/traces {
            content_by_lua_block {
                local cjson = require("cjson")
                local mock = require("mock_data")
                
                local args = ngx.req.get_uri_args()
                local count = tonumber(args.count) or 10
                
                local result = mock.generate_random_traces(count)
                ngx.say(cjson.encode(result))
            }
        }
        
        location /mock/emails {
            content_by_lua_block {
                local cjson = require("cjson")
                local mock = require("mock_data")
                
                local args = ngx.req.get_uri_args()
                local count = tonumber(args.count) or 5
                
                local result = mock.generate_random_emails(count)
                ngx.say(cjson.encode(result))
            }
        }
        
        location /mock/user {
            content_by_lua_block {
                local cjson = require("cjson")
                local mock = require("mock_data")
                
                local args = ngx.req.get_uri_args()
                local user_id = tonumber(args.user_id) or 100
                
                local result = mock.generate_user_session(user_id)
                ngx.say(cjson.encode(result))
            }
        }
        
        location /mock/stats {
            content_by_lua_block {
                local cjson = require("cjson")
                local mock = require("mock_data")
                
                local result = mock.get_stats()
                ngx.say(cjson.encode(result))
            }
        }
  
        location /mock/stream {
            content_by_lua_block {
                local stream = require("stream_mock")
                local args = ngx.req.get_uri_args()
                local duration = tonumber(args.duration) or 30
                local interval = tonumber(args.interval) or 1000
                
                stream.stream_data(duration, interval)
            }
        }
    }
}
